[project]
name = "revspec"
version = "1.0.0"
description = "منصة هندسة عكسية معيارية لإنتاج تقارير قابلة لإعادة التنفيذ بواسطة الذكاء الاصطناعي - للبرامج المملوكة فقط"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="RevSpec Team"}]
keywords = ["reverse-engineering", "static-analysis", "dynamic-analysis", "reimplementation-spec"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "jinja2>=3.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
native = [
  "pefile>=2023.2.7",
  "lief>=0.14",
  "capstone>=5.0",
  "pyelftools>=0.29",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/saradztn/sss"
Repository = "https://github.com/saradztn/sss"

[project.scripts]
revspec = "revspec.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revspec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["revspec"]
